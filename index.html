<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Shynli Cleaning shadcn website design prototype for local cleaning lead generation."
    />
    <link rel="preload" as="image" href="/cleaner-hero.jpg" fetchpriority="high" />
    <title>Shynli Cleaning | shadcn Website Prototype</title>
    <script>
      if (location.pathname.replace(/\/$/, "") === "") {
        document.documentElement.dataset.initialHome = "true"
      }
    </script>
    <style>
      #initial-home-hero {
        display: none;
      }

      html[data-initial-home="true"] #initial-home-hero {
        display: block;
      }

      #initial-home-hero {
        min-height: 100svh;
        background: #0d2633;
        color: #fff;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        overflow: hidden;
        position: relative;
      }

      #initial-home-hero::before {
        background-image:
          linear-gradient(90deg, rgba(10, 34, 48, 0.97) 0%, rgba(10, 34, 48, 0.88) 34%, rgba(10, 34, 48, 0.42) 68%, rgba(10, 34, 48, 0.16) 100%),
          linear-gradient(0deg, rgba(10, 34, 48, 0.94) 0%, rgba(10, 34, 48, 0) 42%),
          url("/cleaner-hero.jpg");
        background-position: 62% 38%;
        background-size: cover;
        content: "";
        inset: 0;
        position: absolute;
      }

      .initial-home-header {
        align-items: center;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        display: flex;
        height: 72px;
        justify-content: space-between;
        left: 0;
        padding: 0 20px;
        position: relative;
        right: 0;
        top: 0;
        z-index: 2;
      }

      .initial-home-brand {
        align-items: center;
        display: inline-flex;
        gap: 12px;
        font-weight: 900;
      }

      .initial-home-mark {
        align-items: center;
        background: #6ed0ff;
        border-radius: 999px;
        color: #082532;
        display: inline-flex;
        height: 38px;
        justify-content: center;
        width: 38px;
      }

      .initial-home-button {
        background: #fff;
        border-radius: 999px;
        color: #082532;
        font-size: 14px;
        font-weight: 900;
        padding: 12px 18px;
        text-decoration: none;
      }

      .initial-home-copy {
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        min-height: calc(100svh - 72px);
        max-width: 780px;
        padding: 96px 20px 120px;
        position: relative;
        z-index: 1;
      }

      .initial-home-eyebrow {
        align-self: flex-start;
        background: rgba(255, 255, 255, 0.12);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 999px;
        color: rgba(255, 255, 255, 0.88);
        font-size: 13px;
        font-weight: 800;
        padding: 7px 14px;
      }

      .initial-home-title {
        font-size: clamp(4.4rem, 11vw, 9.8rem);
        font-weight: 900;
        letter-spacing: 0;
        line-height: 0.82;
        margin: 22px 0 0;
      }

      .initial-home-lcp {
        font-size: clamp(1.55rem, 3vw, 3.45rem);
        font-weight: 900;
        line-height: 0.98;
        margin: 24px 0 0;
        max-width: 680px;
      }

      .initial-home-benefits {
        color: rgba(255, 255, 255, 0.86);
        display: flex;
        flex-wrap: wrap;
        font-size: 14px;
        font-weight: 800;
        gap: 10px 20px;
        margin-top: 24px;
      }

      @media (min-width: 768px) {
        #initial-home-hero::before {
          background-position: center 32%;
        }

        .initial-home-header {
          padding: 0 32px;
        }

        .initial-home-copy {
          padding-left: 32px;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="initial-home-hero" aria-label="Shynli home cleaning">
        <div class="initial-home-header">
          <div class="initial-home-brand">
            <span class="initial-home-mark">S</span>
            <span>Shynli</span>
          </div>
          <a class="initial-home-button" href="https://shynlicleaningservice.com/quote">Get quote</a>
        </div>
        <main class="initial-home-copy">
          <p class="initial-home-eyebrow">Local home cleaning across Chicago's western suburbs</p>
          <h1 class="initial-home-title">Shynli</h1>
          <p class="initial-home-lcp">The clean-home reset handled by real people, with a quote you can understand.</p>
          <div class="initial-home-benefits">
            <span>Supplies included</span>
            <span>Insured local team</span>
            <span>No hidden fees</span>
            <span>Make-it-right follow-up</span>
          </div>
        </main>
      </div>
    </div>
    <script type="module" src="/src/bootstrap.ts"></script>
  </body>
</html>
