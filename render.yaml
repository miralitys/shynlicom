services:
  - type: web
    name: shynli-com
    runtime: node
    repo: https://github.com/miralitys/shynlicom.git
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm start
    domains:
      - shynli.com
      - www.shynli.com
      - shynliairbnbcleaning.com
      - www.shynliairbnbcleaning.com
      - shynliapartmentcleaning.com
      - www.shynliapartmentcleaning.com
      - shynlideepcleaning.com
      - www.shynlideepcleaning.com
      - shynlimoveoutcleaning.com
      - www.shynlimoveoutcleaning.com
      - shynliofficecleaning.com
      - www.shynliofficecleaning.com
      - shynlipostconstructioncleaning.com
      - www.shynlipostconstructioncleaning.com
